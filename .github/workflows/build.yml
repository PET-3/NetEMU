name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test || true

      - name: Build APK (arm64-v8a only)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"
        # target-platform avoids multi-ABI; no --split-per-abi (conflicts with abiFilters)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p dist
          SRC=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          cp "$SRC" dist/NetEMU-arm64-v8a.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetEMU-arm64-v8a
          path: dist/NetEMU-arm64-v8a.apk
          if-no-files-found: error
